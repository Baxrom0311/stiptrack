services:
  nginx:
    build:
      context: ./deploy/nginx
    container_name: stiptrack-nginx-prod
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - stiptrack_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: stiptrack-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stipendiya_db}
      POSTGRES_USER: ${POSTGRES_USER:-stipuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stiptrack_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stiptrack-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - stiptrack_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stiptrack-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER environment variable is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD environment variable is required}
    volumes:
      - minio_data:/data
    networks:
      - stiptrack_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stiptrack-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "1"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stipuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stipendiya_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/3
      DEBUG: "false"
    networks:
      - stiptrack_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 5

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stiptrack-mcp-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stipuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stipendiya_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/3
      DEBUG: "false"
    command: ["python", "mcp/server.py"]
    networks:
      - stiptrack_net
    depends_on:
      backend:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stiptrack-celery-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stipuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stipendiya_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/3
      DEBUG: "false"
    command: ["celery", "-A", "workers.celery_app.celery_app", "worker", "--loglevel=info"]
    networks:
      - stiptrack_net
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Stipendiya Platform}
    container_name: stiptrack-frontend-prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Stipendiya Platform}
    networks:
      - stiptrack_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 5

networks:
  stiptrack_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
